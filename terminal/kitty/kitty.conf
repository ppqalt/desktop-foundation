# Defaults retained unless listed here. Colors are generated from ../palette.json.
include colors.conf
shell fish
linux_display_server wayland
font_family GoogleSansCode Nerd Font Mono
font_size 11.0
background_opacity 0.90
window_padding_width 5
cursor_shape beam
cursor_blink_interval 0
scrollback_lines 10000
confirm_os_window_close -1

# Select the retained screen and full scrollback; Ctrl+C copies normally.
map ctrl+a kitten select_all.py
map escape combine : clear_selection : send_key Escape
map ctrl+c copy_or_interrupt
