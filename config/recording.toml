# Capture at the selected source's native resolution.
shortcut = "Ctrl+Shift+F12" # empty disables the binding
silent_shortcut = "Ctrl+Shift+Alt+F12" # desktop audio only
# no_audio_shortcut = "" # optional video-only shortcut; disabled by default
replay_shortcut = "Ctrl+Shift+F11" # save buffered replay
replay_toggle_shortcut = "Ctrl+Shift+Alt+F11" # start/stop replay buffer
replay_seconds = 300
replay_auto_start = true # five-minute history at login; false disables automatic capture
replay_bitrate_kbps = 16000
capture = "portal" # portal, focused-output, or a discovered output name
resolution = "auto" # always use the selected source resolution
fps = 0 # 0 follows focused-display refresh, limited by max_fps
max_fps = 60
video_codec = "auto" # auto uses GPU Screen Recorder's hardware default
quality = "very_high"
frame_mode = "vfr"
container = "mkv"
directory = "" # XDG Videos/Recordings
cursor = true
restore_portal = true
desktop_audio = "default_output"
microphone_audio = "default_input"
audio_codec = "opus"
audio_bitrate_kbps = 512 # per independent track, never a desktop volume change
startup_timeout_seconds = 120 # includes the portal's selection dialog
stop_timeout_seconds = 30
cancel_timeout_milliseconds = 500 # grace before cancelling an unstarted portal capture
