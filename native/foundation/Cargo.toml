[package]
name = "desktop-foundationctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
default-run = "desktop-foundationctl"

[features]
bench = []

[[bin]]
name = "foundation-measure"
path = "src/bin/measure.rs"
required-features = ["bench"]

[dependencies]
libc = "0.2"
rusqlite = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"

[profile.release]
lto = "thin"
strip = "debuginfo"
