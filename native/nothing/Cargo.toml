[package]
name = "foundation-nothing"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd", "rfcomm"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
uuid = "1"
once_cell = "1"
