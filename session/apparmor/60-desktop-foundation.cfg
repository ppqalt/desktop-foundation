# Generated installer prefix supplies kernel-derived DF_APPARMOR_LSM.
# Explicit boot LSM selections retain their order; activation applies to recovery too.
df_lsm=${DF_APPARMOR_LSM:-}
df_common=
df_normal=
for df_arg in $GRUB_CMDLINE_LINUX $GRUB_CMDLINE_LINUX_DEFAULT; do
    case "$df_arg" in
        lsm=*) df_lsm=${df_arg#lsm=} ;;
    esac
done
[ -n "$df_lsm" ] || { echo 'Missing kernel-derived AppArmor LSM list' >&2; return 1; }
case ",$df_lsm," in
    *,apparmor,*) ;;
    *) df_lsm=$(printf '%s,apparmor' "$df_lsm") ;;
esac
for df_arg in $GRUB_CMDLINE_LINUX; do
    case "$df_arg" in lsm=*|apparmor=*) ;; *) df_common="$df_common $df_arg" ;; esac
done
for df_arg in $GRUB_CMDLINE_LINUX_DEFAULT; do
    case "$df_arg" in lsm=*|apparmor=*) ;; *) df_normal="$df_normal $df_arg" ;; esac
done
GRUB_CMDLINE_LINUX="$df_common apparmor=1 lsm=$df_lsm"
GRUB_CMDLINE_LINUX_DEFAULT=$df_normal
unset df_lsm df_common df_normal df_arg
