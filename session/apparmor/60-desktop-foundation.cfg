# GRUB drop-in: preserve unrelated arguments and the configured LSM order.
df_apparmor_args() {
    df_result=
    df_has_lsm=false
    for df_arg in $1; do
        case "$df_arg" in
        apparmor=*) continue ;;
        lsm=*)
            df_has_lsm=true
            df_arg="lsm=$(printf '%s' "${df_arg#lsm=},apparmor" | awk -F, '{for(i=1;i<=NF;i++) if(!seen[$i]++) {printf "%s%s", sep, $i; sep=","}}')"
            ;;
        esac
        df_result="$df_result $df_arg"
    done
    printf '%s' "$df_result"
}
# Handle either command-line variable without destroying an explicit LSM list.
df_original="$GRUB_CMDLINE_LINUX $GRUB_CMDLINE_LINUX_DEFAULT"
GRUB_CMDLINE_LINUX=$(df_apparmor_args "$GRUB_CMDLINE_LINUX")
GRUB_CMDLINE_LINUX_DEFAULT="$(df_apparmor_args "$GRUB_CMDLINE_LINUX_DEFAULT") apparmor=1"
case " $df_original " in
*' lsm='*) ;;
*) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT lsm=landlock,lockdown,yama,integrity,apparmor,bpf" ;;
esac
unset df_original df_result df_has_lsm df_arg
unset -f df_apparmor_args
