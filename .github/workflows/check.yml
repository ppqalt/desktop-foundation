name: Portable checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep fish fontconfig shellcheck shfmt libdbus-1-dev libsqlite3-dev pkg-config python3-pil nodejs
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Shared Rust backend
        run: |
          cargo fmt --manifest-path native/foundation/Cargo.toml --check
          cargo clippy --locked --manifest-path native/foundation/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path native/foundation/Cargo.toml
          cargo build --locked --release --manifest-path native/foundation/Cargo.toml
      - name: Shell syntax and style
        run: |
          mapfile -t files < <(rg -l '^#!/usr/bin/env bash' scripts)
          shellcheck "${files[@]}"
          shfmt -d "${files[@]}"
      - name: Python and noninteractive tests
        run: |
          python3 -m compileall -q scripts terminal/fastfetch/packages
          python3 -m unittest discover -s tests -v
      - name: Fish syntax
        run: fish --no-config -n terminal/fish/config.fish
      - name: Native earbud backend
        run: |
          cargo fmt --manifest-path native/nothing/Cargo.toml --check
          cargo clippy --locked --manifest-path native/nothing/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path native/nothing/Cargo.toml
          cargo build --locked --release --manifest-path native/nothing/Cargo.toml
