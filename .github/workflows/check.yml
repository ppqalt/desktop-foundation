name: Portable checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test tools
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools ripgrep fish fontconfig shellcheck shfmt libdbus-1-dev libsqlite3-dev libdav1d-dev pkg-config python3-pil nodejs ffmpeg
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Shared Rust backend
        run: |
          cargo fmt --manifest-path native/foundation/Cargo.toml --check
          cargo clippy --locked --manifest-path native/foundation/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path native/foundation/Cargo.toml
          cargo build --locked --release --manifest-path native/foundation/Cargo.toml
      - name: Shell syntax and style
        run: |
          mapfile -t files < <(rg -l '^#!/usr/bin/env bash' scripts terminal/fastfetch)
          shellcheck "${files[@]}"
          shfmt -d "${files[@]}"
      - name: Python and noninteractive tests
        run: |
          python3 -m compileall -q scripts tools
          python3 -m unittest discover -s tests -v
          ./tests/test-niri-package-build
          ./tests/test-install-bootstrap
      - name: Fish syntax
        run: fish --no-config -n terminal/fish/config.fish
      - name: Native earbud backend
        run: |
          cargo fmt --manifest-path native/nothing/Cargo.toml --check
          cargo clippy --locked --manifest-path native/nothing/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path native/nothing/Cargo.toml
          cargo build --locked --release --manifest-path native/nothing/Cargo.toml
  lock-ui:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install actual compositor and QML test dependencies
        run: pacman -Syu --needed --noconfirm python quickshell niri weston swaylock mesa libglvnd fontconfig rust sqlite dav1d wayland dbus ttf-dejavu
      - name: Prepare unprivileged isolated test account
        run: |
          useradd --create-home df-test
          chown -R df-test:df-test "$GITHUB_WORKSPACE"
      - name: Build backend and run required lock UI and private compositor tests
        env:
          DF_REQUIRE_QML_TESTS: '1'
          DF_RUN_NESTED_LOCK_TESTS: '1'
        run: |
          runuser -u df-test -- mkdir -p /home/df-test/.local/share/fonts
          runuser -u df-test -- ln -s "$GITHUB_WORKSPACE/fonts" /home/df-test/.local/share/fonts/desktop-foundation
          runuser -u df-test -- fc-cache -f
          runuser -u df-test -- cargo build --locked --manifest-path native/foundation/Cargo.toml --bins
          runuser -u df-test -- env DF_REQUIRE_QML_TESTS=1 DF_RUN_NESTED_LOCK_TESTS=1 python -m unittest discover -s tests -p test_locking_qml.py -v
