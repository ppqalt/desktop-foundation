# Small, quiet Niri-session toasts. No persistent notification history.
anchor=top-center
layer=overlay
width=320
height=120
margin=16
padding=12
border-size=1
border-radius=10
background-color=#1f262ff5
text-color=#eef1f6
border-color=#495a6d
font=Google Sans Flex 10
icons=0
format=%s\n%b
max-visible=2
max-history=0
history=0
default-timeout=2000
ignore-timeout=1

# Dedicated compact volume readout; canonical tag replaces successive updates.
[app-name=desktop-foundation-volume]
width=250
height=48
padding=6,10
border-radius=8
text-color=#eef1f6
progress-color=over #00000000
font=Google Sans Flex 10
format=%s
default-timeout=1500
