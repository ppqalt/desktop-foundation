# Small, quiet Niri-session toasts. No persistent notification history.
anchor=top-center
layer=overlay
width=320
height=120
margin=16
padding=12
border-size=1
border-radius=10
background-color=#171b22f5
text-color=#b7bec9
border-color=#2b323d
font=Google Sans 10
icons=0
format=%s\n%b
max-visible=2
max-history=0
history=0
default-timeout=2000
ignore-timeout=1
